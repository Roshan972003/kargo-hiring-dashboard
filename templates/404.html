<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not found — Kargo Hiring Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("kargo-theme");
        if (saved) document.documentElement.dataset.theme = saved;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grain"></div>
  <main class="page">
    <section class="panel animate-in" style="text-align:center; padding: 60px 24px;">
      <p style="font-size: 2.5rem; margin: 0 0 8px; font-weight: 800;">404</p>
      <p style="color: var(--muted); margin: 0 0 24px;">That candidate doesn't exist, or was deleted.</p>
      <a href="/" class="btn-primary" style="display:inline-block; text-decoration:none;">Back to dashboard</a>
    </section>
  </main>
</body>
</html>
